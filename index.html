    <!-- Optimized cache busting with performance improvements -->
    <script>
      (function() {
        const buildVersion = '2.0.0'; 
        
        const updateResourceVersions = () => {
          requestIdleCallback(() => {
            const timestamp = Date.now();
            
            // Update script versions
            document.querySelectorAll('script[src]').forEach(script => {
              if (!script.src.includes('cdn.gpteng.co') && !script.src.includes('googlesyndication')) {
                const url = new URL(script.src);
                url.searchParams.set('v', `${buildVersion}.${timestamp}`);
                script.src = url.toString();
              }
            });
            
            // Update stylesheet versions
            document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
              if (link.href && !link.href.includes('googleapis')) {
                const url = new URL(link.href);
                url.searchParams.set('v', `${buildVersion}.${timestamp}`);
                link.href = url.toString();
              }
            });
          });
        };
        
        // Use requestIdleCallback for better performance
        if (window.requestIdleCallback) {
          requestIdleCallback(updateResourceVersions, { timeout: 2000 });
        } else {
          setTimeout(updateResourceVersions, 100);
        }
      })();
    </script>
